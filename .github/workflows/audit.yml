name: v91 Audit Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pytest cryptography

      - name: Run Unit Tests
        run: python -m pytest tests/ -v

      - name: Compile runtime modules
        run: python -m py_compile controller/*.py

      - name: Hash Verification
        run: |
          find ./controller -type f -name "*.py" -exec sha256sum {} \; > audit_hashes.txt
          sha256sum audit_hashes.txt > audit_hashes.sha256
          cat audit_hashes.txt

      - name: Upload Hash Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-hashes
          path: |
            audit_hashes.txt
            audit_hashes.sha256
          retention-days: 90

      - name: Upload Global Status Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: global-status
          path: global-status.json
          retention-days: 90
