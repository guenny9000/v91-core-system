name: v91 Audit Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev deps
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check controller/ tests/

      - name: Ruff format check
        run: ruff format --check controller/ tests/

  # ── Unit & Integration Tests ──────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev deps
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest tests/ -v --ignore=tests/test_listener.py --cov=controller --cov-report=term-missing

      - name: Initialise Listener DB for integration tests
        run: |
          mkdir -p data
          sqlite3 data/v91_independent_state.db < data/init_listener_db.sql
          echo "DB initialised"

      - name: Run Listener integration tests
        run: pytest tests/test_listener.py -v --cov=controller --cov-append --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── Hash / Integrity Audit ────────────────────────────────────────────────────
  audit:
    name: Hash Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Hash controller source files
        run: |
          find ./controller -type f -name "*.py" | sort | xargs sha256sum > audit_hashes.txt
          sha256sum audit_hashes.txt > audit_hashes.sha256
          echo "Hash verification complete"
          cat audit_hashes.txt

      - name: Upload hash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-hashes
          path: |
            audit_hashes.txt
            audit_hashes.sha256

  # ── Docker Build Smoke Test ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: v91-listener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
