name: v91 Audit Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Cross-platform Hash Verification
        run: |
          python -c "import hashlib,pathlib; files=sorted(pathlib.Path('controller').rglob('*.py')); lines=''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.as_posix()+'\n' for p in files); pathlib.Path('audit_hashes.txt').write_text(lines,encoding='utf-8',newline=''); digest=hashlib.sha256(pathlib.Path('audit_hashes.txt').read_bytes()).hexdigest(); pathlib.Path('audit_hashes.sha256').write_text(digest+'  audit_hashes.txt\n',encoding='utf-8',newline=''); print(lines); print('manifest_sha256='+digest)"

      - name: Upload Hash Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-hashes-${{ matrix.os }}
          path: |
            audit_hashes.txt
            audit_hashes.sha256
