name: V91 Use Policy, Replay State and Ingress Gate

on:
  push:
    branches: ["main"]
    paths:
      - "controller/use_policy.py"
      - "controller/task_ingress_gate.py"
      - "controller/replay_state_provider.py"
      - "controller/replay_db_unification.py"
      - "controller/state_monotonicity.py"
      - "tests/test_use_policy.py"
      - "tests/test_task_ingress_gate.py"
      - "tests/test_replay_state_provider.py"
      - "tests/test_replay_db_unification.py"
      - "tests/test_state_monotonicity.py"
      - ".github/workflows/use-policy.yml"
  pull_request:
    paths:
      - "controller/use_policy.py"
      - "controller/task_ingress_gate.py"
      - "controller/replay_state_provider.py"
      - "controller/replay_db_unification.py"
      - "controller/state_monotonicity.py"
      - "tests/test_use_policy.py"
      - "tests/test_task_ingress_gate.py"
      - "tests/test_replay_state_provider.py"
      - "tests/test_replay_db_unification.py"
      - "tests/test_state_monotonicity.py"
      - ".github/workflows/use-policy.yml"

permissions:
  contents: read

jobs:
  policy-replay-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest cryptography
      - name: Run policy, ingress, replay and witness tests
        run: >-
          python -m pytest -q
          tests/test_use_policy.py
          tests/test_task_ingress_gate.py
          tests/test_replay_state_provider.py
          tests/test_replay_db_unification.py
          tests/test_state_monotonicity.py
      - name: Compile policy, replay and ingress modules
        run: >-
          python -m py_compile
          controller/use_policy.py
          controller/task_ingress_gate.py
          controller/replay_state_provider.py
          controller/replay_db_unification.py
          controller/state_monotonicity.py
