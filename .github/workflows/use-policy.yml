name: V91 Use Policy Gate

on:
  push:
    branches: ["main"]
    paths:
      - "controller/use_policy.py"
      - "tests/test_use_policy.py"
      - ".github/workflows/use-policy.yml"
  pull_request:
    paths:
      - "controller/use_policy.py"
      - "tests/test_use_policy.py"
      - ".github/workflows/use-policy.yml"

permissions:
  contents: read

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run policy gate tests
        run: python -m pytest -q tests/test_use_policy.py
      - name: Compile policy module
        run: python -m py_compile controller/use_policy.py
