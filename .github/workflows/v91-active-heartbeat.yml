name: V91 active heartbeat

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Scheduled runs start only on the default branch.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: v91-active-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Heartbeat and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run repository tests
        id: tests
        run: python -m pytest tests/ -v
      - name: Write heartbeat evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              "schema": "v91-heartbeat-evidence-v1",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["COMMIT_SHA"],
              "workflow_run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "trigger": os.environ["EVENT_NAME"],
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "scope": "GitHub runner and repository tests only",
              "external_systems_monitored": False,
              "local_user_computer_monitored": False
          }
          with open("v91-heartbeat-evidence.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(json.dumps(data, indent=2))
          PY
      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v91-heartbeat-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: v91-heartbeat-evidence.json
          if-no-files-found: error
          retention-days: 30
