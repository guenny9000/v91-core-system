name: V91 Disarmament CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: v91-disarmament-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disarmament-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run existing disarmament test suites
        run: |
          python -m pytest -v \
            tests/test_disarmament_monitor.py \
            tests/test_disarmament_reduction_stages.py
