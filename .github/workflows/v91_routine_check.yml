# V91 Routine Check: getakteter Regelbetrieb der PRUEF-STUFE (V99-Autonomiestufe 1).
# Fehleranalyse 24.11.2026: CI lief bisher NUR push/pull_request-getrieben;
# dieser Check schliesst die Luecke eines getakteten, read-only Routine-
# betriebs. Er ist KEIN Daemon im Sinne der Dauerregeln: er laeuft auf der
# GitHub-Infrastruktur des Betreibers, tastbar in dessen Actions-Tab,
# erteilt KEINE Rechte, ergreift KEINE Aktionen (AUTOMATE_ROUTINE == Pruefen,
# KLASSIFIKATION != EINGRIFF). Bei Befunden schlaegt der Job sichtbar fehl;
# er oeffnet KEINE Issues automatisch und schreibt in keine Bestaende.
name: V91 Routine Check
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: v91-routine-check
  cancel-in-progress: false
jobs:
  routine-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies (wie Audit-Pipeline, keine weiteren)
        run: pip install --no-cache-dir pytest cryptography
      - name: Architektur-Index-Lint (Aenderungslog-Integritaet)
        run: python3 -m controller.index_lint docs/V91-ARCHITEKTUR-INDEX.md
      - name: Secret-Scan (fail-closed, Repository-Bestand)
        run: python3 -m controller.secret_scan --path .
      - name: Fiction-Scan (Fiktions-Marker duerfen nie in Code)
        run: python3 -m controller.fiction_scan --path .
      - name: Volle stdlib-Unittest-Suite (PYTHONPATH=Wurzel)
        run: PYTHONPATH=. python3 -m unittest discover -s tests -q
      - name: Zusammenfassung
        if: always()
        run: |
          echo "V91 Routine Check beendet. Ein FEHL hier bedeutet: Index, Scan oder Tests haben einen echten Befund. UNKNOWN != PASS; dieser Lauf IST ein Betriebsnachweis nur fuer diesen Zeitpunkt."
