services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v91-controller
    command: ["python", "controller/controller.py"]
    volumes:
      - ./controller:/app/controller
      - ./logs:/app/logs
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
      V91_MODE: "${V91_MODE:-safe}"

  # Placeholder retained until real task processing is implemented.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v91-worker
    command: ["python", "-u", "-c", "import time; print('Worker placeholder: task processor not configured'); time.sleep(3600)"]
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
