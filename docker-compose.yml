services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v91-controller
    command: ["python", "controller/controller.py"]
    volumes:
      - ./controller:/app/controller
      - ./logs:/app/logs
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
      V91_MODE: "${V91_MODE:-safe}"
      V91_SIMULATION_ITERATIONS: "${V91_SIMULATION_ITERATIONS:-10}"
      V91_SIMULATION_INTERVAL_SECONDS: "${V91_SIMULATION_INTERVAL_SECONDS:-0}"

  # Placeholder only: this service does not process tasks yet.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-u", "-c", "import time; print('Worker placeholder - no task processor configured'); time.sleep(3600)"]
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
