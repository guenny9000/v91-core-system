version: "3.9"
services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v91-controller
    user: "${V91_CONTAINER_UID:-1000}:${V91_CONTAINER_GID:-1000}"
    command: python -u controller/observer.py
    networks:
      - v91_internal
    volumes:
      - ./controller:/app/controller
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./queue:/app/queue
      - ./workspace:/app/workspace:ro
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - V91_QUEUE_DIR=/app/queue
      - V91_RUNTIME_DIR=/app/runtime
      - V91_WORKSPACE_DIR=/app/workspace
      - V91_OBSERVER_POLL_SECONDS=10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${V91_CONTAINER_UID:-1000}:${V91_CONTAINER_GID:-1000}"
    command: python -u controller/worker.py
    networks:
      - v91_internal
    volumes:
      - ./queue:/app/queue
      - ./runtime:/app/runtime
      - ./workspace:/app/workspace:ro
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - V91_QUEUE_DIR=/app/queue
      - V91_RUNTIME_DIR=/app/runtime
      - V91_WORKSPACE_DIR=/app/workspace
      - V91_WORKER_POLL_SECONDS=1

networks:
  v91_internal:
    internal: true
