# Grafana configuration (minimal)
[server]
# HTTP port
http_port = 3000
# Serve only on localhost for security – change to 0.0.0.0 if remote access required
localhost = true

[auth]
# Disable anonymous access – require login
disable_login_form = false
# Default admin user/password (change after first start)
admin_user = admin
admin_password = admin

[log]
mode = console
level = info
