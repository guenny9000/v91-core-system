[tool.ruff]
target-version = "py311"
line-length = 100
src = ["controller", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade
# S = bandit security, B = bugbear, C4 = comprehensions, SIM = simplify
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "S603",  # subprocess without shell=True is fine
  "B904",  # raise ... from exc – opt-in
]

[tool.ruff.lint.isort]
known-first-party = ["controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
